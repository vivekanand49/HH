# A complete pilot server on one machine: the app plus PostgreSQL.
#   1. cp server/.env.example .env.production and fill it in (see docs/DEPLOY.md)
#   2. docker compose up -d
# Put HTTPS in front (Caddy, nginx or a cloud load balancer); the app listens on port 4000.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: swasthya
      POSTGRES_USER: swasthya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swasthya -d swasthya"]
      interval: 10s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://swasthya:${POSTGRES_PASSWORD}@db:5432/swasthya
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
